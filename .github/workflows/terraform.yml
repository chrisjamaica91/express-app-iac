name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "stacks/**"
      - "constructs/**"
      - "config/**"
      - "main.ts"
      - "cdktf.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for OIDC
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-2
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validate and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, use the base branch (target)
            if [ "${{ github.base_ref }}" == "main" ]; then
              ENV="prod"
            elif [ "${{ github.base_ref }}" == "staging" ]; then
              ENV="staging"
            else
              ENV="dev"
            fi
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Validating environment: $ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: CDKTF Synth
        run: npm run synth
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}

      - name: Upload synth artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdktf-out
          path: cdktf.out/
          retention-days: 7

      # Security Scanning
      - name: Run Terrascan
        uses: tenable/terrascan-action@v1.5.0
        with:
          iac_type: "terraform"
          iac_dir: "cdktf.out/stacks/express-app-iac-${{ steps.env.outputs.environment }}"
          policy_type: "aws"
          only_warn: true
          sarif_upload: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cdktf.out/stacks/
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "cdktf.out/stacks/express-app-iac-${{ steps.env.outputs.environment }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Determine Environment
        id: env
        run: |
          # For PRs, use the base branch (target)
          if [ "${{ github.base_ref }}" == "main" ]; then
            ENV="prod"
          elif [ "${{ github.base_ref }}" == "staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Planning for environment: $ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deployment-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check and Deploy IAM Stack if Needed
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          IAM_STATE_KEY="${ENV}/express-app-iam-${ENV}/terraform.tfstate"
          BUCKET="express-app-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"

          echo "Checking if IAM stack exists for environment: $ENV"

          # Check if IAM stack state file exists in S3
          if aws s3 ls "s3://${BUCKET}/${IAM_STATE_KEY}" 2>/dev/null; then
            echo "✓ IAM stack already exists for $ENV environment"
          else
            echo "⚠ IAM stack does not exist for $ENV environment"
            echo "Deploying IAM stack first..."
            
            # Synth and deploy IAM stack only
            npm run synth
            npx cdktf deploy express-app-iam-${ENV} --auto-approve
            
            echo "✓ IAM stack deployed successfully"
          fi
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}

      - name: CDKTF Plan
        run: |
          npm run synth
          cd cdktf.out/stacks/express-app-iac-${{ steps.env.outputs.environment }}
          terraform init
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > ../../../terraform-plan.txt
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform-plan.txt
          retention-days: 5

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'development') }}
      url: https://console.aws.amazon.com/ecs/v2/clusters
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          echo "Deploying to environment: $ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deployment-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformDeploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: CDKTF Deploy
        run: npx cdktf deploy express-app-iam-${{ steps.env.outputs.environment }} express-app-iac-${{ steps.env.outputs.environment }} --auto-approve
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}

      - name: Post deployment summary
        run: |
          echo "## ✅ Infrastructure Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  ai-analysis:
    name: AI Deployment Analysis
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deployment-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AIAnalysis

      - name: Gather Deployment Metrics
        id: metrics
        run: |
          # Get ECS service status
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster express-app-cluster \
            --services express-app-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Running:runningCount,Desired:desiredCount,Status:status}' \
            --output json)

          # Get recent CloudWatch logs (last 5 minutes)
          LOG_EVENTS=$(aws logs filter-log-events \
            --log-group-name /ecs/express-app-service \
            --start-time $(($(date +%s) - 300))000 \
            --limit 20 \
            --region ${{ env.AWS_REGION }} \
            --query 'events[*].message' \
            --output text 2>/dev/null || echo "No logs available")

          # Get ALB target health
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names express-app-alb-tg \
            --region ${{ env.AWS_REGION }} \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          TARGET_HEALTH=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --region ${{ env.AWS_REGION }} \
            --query 'TargetHealthDescriptions[*].{State:TargetHealth.State,Reason:TargetHealth.Reason}' \
            --output json)

          echo "service-status<<EOF" >> $GITHUB_OUTPUT
          echo "$SERVICE_STATUS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG_EVENTS" | head -c 2000 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "target-health<<EOF" >> $GITHUB_OUTPUT
          echo "$TARGET_HEALTH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI Deployment Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Prepare context for AI
          DEPLOYMENT_STATUS="${{ needs.deploy.result }}"
          COMMIT_MSG=$(git log -1 --pretty=%B || echo "Deployment from GitHub Actions")

          # Create prompt for OpenAI
          cat > prompt.txt << 'EOFPROMPT'
          You are a DevOps expert analyzing an AWS ECS Fargate deployment.

          **Deployment Status:** $DEPLOYMENT_STATUS
          **Commit:** ${{ github.sha }}
          **Message:** $COMMIT_MSG

          **ECS Service Status:**
          ${{ steps.metrics.outputs.service-status }}

          **Target Health:**
          ${{ steps.metrics.outputs.target-health }}

          **Recent Logs (last 5 min):**
          ${{ steps.metrics.outputs.logs }}

          Provide a concise analysis (max 200 words):
          1. **Health Assessment** - Overall deployment health (✅/⚠️/❌)
          2. **Key Observations** - Notable patterns in logs or metrics
          3. **Action Items** - Specific recommendations (if any issues detected)
          4. **Performance Notes** - Any performance insights

          Be specific and actionable. Focus on real issues, not hypotheticals.
          EOFPROMPT

          PROMPT_CONTENT=$(cat prompt.txt | envsubst)

          # Call OpenAI API
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an expert DevOps engineer specializing in AWS ECS deployments. Provide concise, actionable analysis.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": $(echo "$PROMPT_CONTENT" | jq -Rs .)
                }
              ],
              \"temperature\": 0.3,
              \"max_tokens\": 400
            }")

          # Extract AI response
          AI_ANALYSIS=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI analysis unavailable"')

          # Post to GitHub Actions summary
          echo "## 🤖 AI Deployment Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$AI_ANALYSIS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Analysis powered by OpenAI GPT-4o-mini_" >> $GITHUB_STEP_SUMMARY

          # Also output to console
          echo "=== AI Analysis ==="
          echo "$AI_ANALYSIS"

  ai-scan-analysis:
    name: AI Scan Analysis
    runs-on: ubuntu-latest
    needs: [validate, plan]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: cdktf-out
          path: cdktf.out/

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Analyze scans with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Validate API key is set
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is not set!"
            echo "AI analysis unavailable" > ai-review.txt
            exit 0
          fi

          # Capture scan results from previous jobs
          VALIDATION_STATUS="${{ needs.validate.result }}"
          PLAN_STATUS="${{ needs.plan.result }}"

          # Build prompt
          PROMPT="Analyze this Terraform infrastructure change:

          Validation Status: $VALIDATION_STATUS
          Plan Status: $PLAN_STATUS
          PR Title: ${{ github.event.pull_request.title }}
          Author: ${{ github.actor }}

          Provide a concise review (max 200 words):
          1. Security Assessment - Any concerns from scans?
          2. Infrastructure Changes - What resources are affected?
          3. Recommendation - Approve, request changes, or concerns?
          4. Best Practice Suggestions

          Be constructive and specific."

          # Call OpenAI API
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a senior DevOps engineer reviewing infrastructure code.\"},{\"role\":\"user\",\"content\":$PROMPT_JSON}],\"temperature\":0.3,\"max_tokens\":400}")

          # Debug output
          echo "API Response received (first 200 chars):"
          echo "$RESPONSE" | head -c 200
          echo ""

          # Check for errors in response
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "OpenAI API Error: $ERROR"
            AI_REVIEW="⚠️ AI analysis temporarily unavailable: $ERROR"
          else
            AI_REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI analysis unavailable"')
          fi

          # Save for PR comment
          echo "$AI_REVIEW" > ai-review.txt

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const aiReview = fs.readFileSync('ai-review.txt', 'utf8');

            // Read terraform plan output
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('terraform-plan.txt', 'utf8');
              // Truncate if too long (GitHub comment limit is ~65k chars)
              if (planOutput.length > 50000) {
                planOutput = planOutput.substring(0, 50000) + '\n\n... (truncated - see workflow logs for full output)';
              }
            } catch (error) {
              planOutput = 'Plan output not available';
            }

            const comment = `## 🤖 AI Infrastructure Review

            ${aiReview}

            ---

            ## 📋 Terraform Plan Output

            <details>
            <summary>Click to expand plan details</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            ---

            **Scan Results:**
            - ✅ Validate: ${{ needs.validate.result }}
            - ✅ Plan: ${{ needs.plan.result }}

            *Powered by OpenAI GPT-4o-mini*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
